name: ECE Verify Reusable

on:
  workflow_call:
    inputs:
      target_repo_id:
        description: "Expected numeric GitHub REST repository ID (e.g. 1432704795)"
        required: true
        type: string
      target_owner:
        description: "Target repository owner (e.g. ErenTahiroglu)"
        required: true
        type: string
      target_repo:
        description: "Target repository name (e.g. Evidence-Checkpoint-Engine)"
        required: true
        type: string
      target_commit_sha:
        description: "Target full 40-character commit SHA"
        required: true
        type: string
      target_run_id:
        description: "Target workflow run ID (e.g. 40969401836)"
        required: true
        type: string
      target_run_attempt:
        description: "Target workflow run attempt number"
        required: false
        type: number
        default: 1
      target_workflow_path:
        description: "Expected workflow definition path"
        required: false
        type: string
        default: ".github/workflows/build-and-test.yml"
      policy_selection:
        description: "Operator-approved trusted policy (e.g. ece-pilot-four-runner-matrix)"
        required: false
        type: string
        default: "ece-pilot-four-runner-matrix"
      gate_mode:
        description: "Verification gate mode: 'observation' (report only) or 'strict' (fail unless accepted)"
        required: false
        type: string
        default: "strict"
      verifier_ref:
        description: "Commit SHA of approved ECE verifier source (fixed to approved baseline: fbea48be57adfe8bbf1dbd75c8c425eb7cf9f86c)"
        required: false
        type: string
        default: "fbea48be57adfe8bbf1dbd75c8c425eb7cf9f86c"
      verifier_repo:
        description: "Repository of approved ECE verifier source (fixed to ErenTahiroglu/Evidence-Checkpoint-Engine)"
        required: false
        type: string
        default: "ErenTahiroglu/Evidence-Checkpoint-Engine"
    secrets:
      evidence_token:
        description: "Optional GitHub token for evidence API access (defaults to github.token)"
        required: false
    outputs:
      verdict:
        description: "ECE verifier verdict (e.g. ASSESSED_LIMITATIONS, ASSESSED_PROVISIONAL_PASS, ASSESSED_FAIL)"
        value: ${{ jobs.verify.outputs.verdict }}
      exit_code:
        description: "ECE verifier numeric exit code (0, 1, 2, 3, 4)"
        value: ${{ jobs.verify.outputs.exit_code }}
      cli_rc:
        description: "Actual CLI process return code"
        value: ${{ jobs.verify.outputs.cli_rc }}
      ci_status:
        description: "CI execution status (e.g. VERIFIED_PASS, FAILED, UNVERIFIED_RUN)"
        value: ${{ jobs.verify.outputs.ci_status }}
      checkpoint_accepted:
        description: "Whether checkpoint is genuinely accepted (true only for exit code 0 and ASSESSED_PROVISIONAL_PASS)"
        value: ${{ jobs.verify.outputs.checkpoint_accepted }}
      verifier_source_sha:
        description: "Commit SHA of the approved ECE verifier source used"
        value: ${{ jobs.verify.outputs.verifier_source_sha }}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      verdict: ${{ steps.parse_and_summarize.outputs.verdict }}
      exit_code: ${{ steps.parse_and_summarize.outputs.exit_code }}
      cli_rc: ${{ steps.parse_and_summarize.outputs.cli_rc }}
      ci_status: ${{ steps.parse_and_summarize.outputs.ci_status }}
      checkpoint_accepted: ${{ steps.parse_and_summarize.outputs.checkpoint_accepted }}
      verifier_source_sha: ${{ steps.provenance.outputs.verifier_source_sha }}

    steps:
      - name: Validate input contract and policy scope
        env:
          INPUT_REPO_ID: ${{ inputs.target_repo_id }}
          INPUT_OWNER: ${{ inputs.target_owner }}
          INPUT_REPO: ${{ inputs.target_repo }}
          INPUT_COMMIT_SHA: ${{ inputs.target_commit_sha }}
          INPUT_RUN_ID: ${{ inputs.target_run_id }}
          INPUT_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
          INPUT_POLICY: ${{ inputs.policy_selection }}
          INPUT_GATE_MODE: ${{ inputs.gate_mode }}
          INPUT_VERIFIER_REPO: ${{ inputs.verifier_repo }}
          INPUT_VERIFIER_REF: ${{ inputs.verifier_ref }}
        run: |
          set -euo pipefail

          # 1. Validate Gate Mode
          if [ "$INPUT_GATE_MODE" != "observation" ] && [ "$INPUT_GATE_MODE" != "strict" ]; then
            echo "::error::Invalid gate_mode '$INPUT_GATE_MODE'. Must be 'observation' or 'strict'."
            exit 1
          fi

          # 2. Validate Trusted Policy Selection
          if [ "$INPUT_POLICY" != "ece-pilot-four-runner-matrix" ]; then
            echo "::error::Unsupported policy '$INPUT_POLICY'. Supported policy: 'ece-pilot-four-runner-matrix'."
            exit 1
          fi

          # 3. Reject Unsupported Repository / Policy Combinations
          if [ "$INPUT_POLICY" = "ece-pilot-four-runner-matrix" ] && [ "$INPUT_REPO_ID" != "1432704795" ]; then
            echo "::error::Policy 'ece-pilot-four-runner-matrix' is exclusively scoped to ECE repository ID 1432704795; got '$INPUT_REPO_ID'."
            exit 1
          fi

          # 4. Validate Commit SHA format (40 hex chars)
          if ! [[ "$INPUT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid target_commit_sha '$INPUT_COMMIT_SHA'. Must be full 40-character hex SHA."
            exit 1
          fi

          # 5. Validate Numeric IDs and Attempts
          if ! [[ "$INPUT_REPO_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid target_repo_id '$INPUT_REPO_ID'. Must be numeric."
            exit 1
          fi

          if ! [[ "$INPUT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid target_run_id '$INPUT_RUN_ID'. Must be numeric."
            exit 1
          fi

          if ! [[ "$INPUT_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || [ "$INPUT_RUN_ATTEMPT" -lt 1 ]; then
            echo "::error::Invalid target_run_attempt '$INPUT_RUN_ATTEMPT'. Must be a positive integer."
            exit 1
          fi

          # 6. Validate Immutable Verifier Source Authority (GOV-03 R1)
          if [ "$INPUT_VERIFIER_REPO" != "ErenTahiroglu/Evidence-Checkpoint-Engine" ]; then
            echo "::error::Unauthorized verifier_repo '$INPUT_VERIFIER_REPO'. For authoritative gate use, repository must be 'ErenTahiroglu/Evidence-Checkpoint-Engine'."
            exit 1
          fi

          if [ -n "$INPUT_VERIFIER_REF" ] && [ "$INPUT_VERIFIER_REF" != "fbea48be57adfe8bbf1dbd75c8c425eb7cf9f86c" ]; then
            echo "::error::Unauthorized verifier_ref '$INPUT_VERIFIER_REF'. For authoritative gate use, source commit must be approved immutable GOV-02 baseline 'fbea48be57adfe8bbf1dbd75c8c425eb7cf9f86c'."
            exit 1
          fi

          echo "Input contract and policy scope validated successfully."

      - name: Checkout approved immutable ECE verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ErenTahiroglu/Evidence-Checkpoint-Engine
          ref: fbea48be57adfe8bbf1dbd75c8c425eb7cf9f86c
          path: ece-verifier
          persist-credentials: false

      - name: Verify verifier source integrity and bind provenance
        id: provenance
        env:
          EXPECTED_SHA: "fbea48be57adfe8bbf1dbd75c8c425eb7cf9f86c"
          CALLER_REPO: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.sha }}
          TARGET_REPO_ID: ${{ inputs.target_repo_id }}
          TARGET_OWNER: ${{ inputs.target_owner }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_COMMIT: ${{ inputs.target_commit_sha }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
          GATE_MODE: ${{ inputs.gate_mode }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git -C ece-verifier rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Verifier source integrity check failed: expected '$EXPECTED_SHA', got '$ACTUAL_SHA'"
            exit 1
          fi
          echo "verifier_source_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "================================================================"
          echo "ECE Verifier Provenance (Strictly Bound):"
          echo "  Caller Repository: $CALLER_REPO"
          echo "  Caller Ref:        $CALLER_REF"
          echo "  Caller SHA:        $CALLER_SHA"
          echo "  Approved Verifier: ErenTahiroglu/Evidence-Checkpoint-Engine"
          echo "  Verifier Source:   $ACTUAL_SHA (immutable GOV-02 baseline)"
          echo "  Target Repo ID:    $TARGET_REPO_ID"
          echo "  Target Repo:       $TARGET_OWNER/$TARGET_REPO"
          echo "  Target Commit:     $TARGET_COMMIT"
          echo "  Target Run ID:     $TARGET_RUN_ID"
          echo "  Target Run Attempt:$TARGET_RUN_ATTEMPT"
          echo "  Gate Mode:         $GATE_MODE"
          echo "================================================================"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reusable-${{ hashFiles('ece-verifier/ece/Cargo.lock', 'ece-verifier/ece/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-reusable-

      - name: Build ECE verifier binary
        working-directory: ece-verifier/ece
        run: cargo build --locked --release

      - name: Execute ECE verifier against target GitHub evidence
        id: run_verifier
        env:
          TARGET_OWNER: ${{ inputs.target_owner }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REPO_ID: ${{ inputs.target_repo_id }}
          TARGET_COMMIT_SHA: ${{ inputs.target_commit_sha }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
          PASSED_TOKEN: ${{ secrets.evidence_token }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ -n "$PASSED_TOKEN" ]; then
            export GITHUB_TOKEN="$PASSED_TOKEN"
          elif [ -n "$DEFAULT_TOKEN" ]; then
            export GITHUB_TOKEN="$DEFAULT_TOKEN"
          fi

          mkdir -p verifier_output
          ./ece-verifier/ece/target/release/ece assess-github-run \
            --owner "$TARGET_OWNER" \
            --repo "$TARGET_REPO" \
            --expected-repo-id "$TARGET_REPO_ID" \
            --commit-sha "$TARGET_COMMIT_SHA" \
            --run-id "$TARGET_RUN_ID" \
            --run-attempt "$TARGET_RUN_ATTEMPT" \
            --schema-dir ece-verifier/docs/gov-00/schemas > verifier_output/assessment.json 2> verifier_output/ece_stderr.log
          CLI_RC=$?
          set -e

          echo "CLI process exited with code: $CLI_RC"
          echo "cli_rc=$CLI_RC" >> "$GITHUB_OUTPUT"

      - name: Parse output and generate structured six-dimensional summary
        id: parse_and_summarize
        env:
          CLI_RC: ${{ steps.run_verifier.outputs.cli_rc }}
          GATE_MODE: ${{ inputs.gate_mode }}
          TARGET_REPO_ID: ${{ inputs.target_repo_id }}
          TARGET_OWNER: ${{ inputs.target_owner }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_COMMIT_SHA: ${{ inputs.target_commit_sha }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
          POLICY_SELECTION: ${{ inputs.policy_selection }}
          ECE_VERIFIER_SHA: ${{ steps.provenance.outputs.verifier_source_sha }}
        run: |
          python3 - << 'PYEOF'
          import html
          import json
          import os
          import sys

          ALLOWED_VERDICTS = [
              "ASSESSED_PROVISIONAL_PASS",
              "ASSESSED_LIMITATIONS",
              "ASSESSED_FAIL",
              "INSUFFICIENT_EVIDENCE",
              "REFUSED",
          ]

          cli_rc_str = os.environ.get("CLI_RC", "")
          try:
              cli_rc = int(cli_rc_str)
          except (ValueError, TypeError):
              cli_rc = 4

          gate_mode = os.environ.get("GATE_MODE", "strict")
          target_repo_id = os.environ.get("TARGET_REPO_ID", "")
          target_owner = os.environ.get("TARGET_OWNER", "")
          target_repo = os.environ.get("TARGET_REPO", "")
          target_commit = os.environ.get("TARGET_COMMIT_SHA", "")
          target_run_id = os.environ.get("TARGET_RUN_ID", "")
          target_attempt = os.environ.get("TARGET_RUN_ATTEMPT", "1")
          policy_selection = os.environ.get("POLICY_SELECTION", "")
          verifier_sha = os.environ.get("ECE_VERIFIER_SHA", "unknown")
          github_output = os.environ.get("GITHUB_OUTPUT", "")
          github_step_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")

          assessment_file = "verifier_output/assessment.json"
          stderr_file = "verifier_output/ece_stderr.log"

          data = None
          is_valid_assessment = False
          parse_error_msg = None

          if not os.path.exists(assessment_file) or os.path.getsize(assessment_file) == 0:
              parse_error_msg = "Assessment output file missing or empty"
          else:
              try:
                  with open(assessment_file, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if not isinstance(data, dict):
                      parse_error_msg = "Assessment root is not a valid JSON object"
                  else:
                      is_valid_assessment = True
              except Exception as e:
                  parse_error_msg = f"Failed to parse assessment JSON: {e}"

          if not is_valid_assessment:
              print(f"Warning: {parse_error_msg}", file=sys.stderr)
              data = {}

          derived = data.get("derived_summary", {}) if isinstance(data, dict) else {}
          raw_verdict = derived.get("verdict") if isinstance(derived, dict) else None

          # Strictly validate verdict against schema enum
          if raw_verdict in ALLOWED_VERDICTS:
              verdict = raw_verdict
          else:
              verdict = "REFUSED" if cli_rc != 0 else "OPERATIONAL_ERROR"
              if is_valid_assessment:
                  is_valid_assessment = False
                  print(f"Warning: Unknown or invalid verdict '{raw_verdict}'", file=sys.stderr)

          json_exit_code = data.get("exit_code") if isinstance(data, dict) else None
          if json_exit_code is not None and not isinstance(json_exit_code, int):
              is_valid_assessment = False
              json_exit_code = None

          # Strictly require CLI process exit code to match JSON exit code
          contradiction = False
          if is_valid_assessment:
              if json_exit_code != cli_rc:
                  contradiction = True
                  is_valid_assessment = False
                  print(
                      f"Contradiction detected: CLI process exit code ({cli_rc}) != JSON exit_code ({json_exit_code})",
                      file=sys.stderr,
                  )

          effective_exit_code = cli_rc if (json_exit_code is None or contradiction) else json_exit_code

          dimensions = data.get("dimensions", {}) if isinstance(data, dict) else {}
          ci_exec = dimensions.get("ci_execution", {}) if isinstance(dimensions, dict) else {}
          ci_status = ci_exec.get("status", "UNVERIFIED_RUN")
          observed_jobs = ci_exec.get("observed_jobs_count", 0)
          expected_jobs = ci_exec.get("expected_jobs_count", 0)

          # Checkpoint acceptance strictly requires:
          # 1. Structural validity without parse errors or contradiction
          # 2. Real CLI process exit code == 0
          # 3. JSON reported exit code == 0
          # 4. Verdict is ASSESSED_PROVISIONAL_PASS
          # 5. CI status is VERIFIED_PASS
          checkpoint_accepted = "false"
          if (
              is_valid_assessment
              and not contradiction
              and cli_rc == 0
              and effective_exit_code == 0
              and verdict == "ASSESSED_PROVISIONAL_PASS"
              and ci_status == "VERIFIED_PASS"
          ):
              checkpoint_accepted = "true"

          # Write Step Outputs
          if github_output:
              with open(github_output, "a", encoding="utf-8") as out:
                  out.write(f"verdict={verdict}\n")
                  out.write(f"exit_code={effective_exit_code}\n")
                  out.write(f"cli_rc={cli_rc}\n")
                  out.write(f"ci_status={ci_status}\n")
                  out.write(f"checkpoint_accepted={checkpoint_accepted}\n")
                  out.write(f"is_valid_assessment={'true' if is_valid_assessment else 'false'}\n")

          # Safe markdown escaping helpers
          def sanitize_cell(val):
              s = str(val) if val is not None else ""
              s = html.escape(s)
              return s.replace("|", "&#124;").replace("\n", " ").replace("\r", "")

          def sanitize_block(val):
              s = str(val) if val is not None else ""
              return html.escape(s).replace("\r", "")

          # Write Structured GITHUB_STEP_SUMMARY
          summary = []
          summary.append("## Evidence Checkpoint Engine — Verification Summary\n")
          summary.append("| Parameter | Value |")
          summary.append("| :--- | :--- |")
          summary.append(f"| **Gate Mode** | `{sanitize_cell(gate_mode)}` |")
          summary.append(f"| **Checkpoint Accepted** | `{sanitize_cell(checkpoint_accepted)}` |")
          summary.append(f"| **Engine Verdict** | **`{sanitize_cell(verdict)}`** (Exit Code `{sanitize_cell(effective_exit_code)}`, Process `{sanitize_cell(cli_rc)}`) |")
          summary.append(f"| **Target Repository** | `{sanitize_cell(target_owner)}/{sanitize_cell(target_repo)}` (ID: `{sanitize_cell(target_repo_id)}`) |")
          summary.append(f"| **Target Commit SHA** | `{sanitize_cell(target_commit)}` |")
          summary.append(f"| **Target Workflow Run** | Run `{sanitize_cell(target_run_id)}` (Attempt `{sanitize_cell(target_attempt)}`) |")
          summary.append(f"| **Trusted Check Policy** | `{sanitize_cell(policy_selection)}` |")
          summary.append(f"| **ECE Verifier Source** | `{sanitize_cell(verifier_sha)}` |\n")

          summary.append("### Six-Dimensional Trust Status\n")
          summary.append("| Dimension | Status | Key Information |")
          summary.append("| :--- | :--- | :--- |")

          # 1. Evidence Integrity
          ev_int = dimensions.get("evidence_integrity", {}) if isinstance(dimensions, dict) else {}
          status_int = ev_int.get("status", "NOT_EVALUATED")
          details_int = ev_int.get("details", "")
          summary.append(f"| **Evidence Integrity** | `{sanitize_cell(status_int)}` | {sanitize_cell(details_int)} |")

          # 2. CI Execution
          summary.append(f"| **CI Execution** | `{sanitize_cell(ci_status)}` | {sanitize_cell(observed_jobs)}/{sanitize_cell(expected_jobs)} policy jobs observed completed with success |")

          # 3. Evidence Availability
          ev_avail = dimensions.get("evidence_availability", {}) if isinstance(dimensions, dict) else {}
          status_avail = ev_avail.get("status", "NOT_PROVIDED")
          summary.append(f"| **Evidence Availability** | `{sanitize_cell(status_avail)}` | Provider artifacts verification |")

          # 4. Independent Review
          rev = dimensions.get("review_status", {}) if isinstance(dimensions, dict) else {}
          status_rev = rev.get("status", "UNREVIEWED")
          tier_rev = rev.get("tier", "NONE")
          summary.append(f"| **Independent Review** | `{sanitize_cell(status_rev)}` | Tier: `{sanitize_cell(tier_rev)}` |")

          # 5. Human Authorization
          auth = dimensions.get("authorization", {}) if isinstance(dimensions, dict) else {}
          status_auth = auth.get("status", "AUTHORIZATION_PENDING")
          summary.append(f"| **Human Authorization** | `{sanitize_cell(status_auth)}` | Owner decision pending |")

          # 6. Freshness
          fresh = dimensions.get("freshness", {}) if isinstance(dimensions, dict) else {}
          status_fresh = fresh.get("status", "HISTORICAL_BASELINE")
          summary.append(f"| **Freshness** | `{sanitize_cell(status_fresh)}` | Head SHA unpinned |")

          blocking = derived.get("blocking_reasons", []) if isinstance(derived, dict) else []
          warnings = derived.get("warnings", []) if isinstance(derived, dict) else []

          if blocking and isinstance(blocking, list):
              summary.append("\n#### Blocking Reasons")
              for b in blocking:
                  summary.append(f"- ⚠️ {sanitize_block(b)}")

          if warnings and isinstance(warnings, list):
              summary.append("\n#### Warnings & Invariants")
              for w in warnings:
                  summary.append(f"- ℹ️ {sanitize_block(w)}")

          if github_step_summary:
              with open(github_step_summary, "a", encoding="utf-8") as s:
                  s.write("\n".join(summary) + "\n")

          print("Step outputs and GITHUB_STEP_SUMMARY generated.")
          PYEOF

      - name: Enforce gate semantics
        env:
          GATE_MODE: ${{ inputs.gate_mode }}
          VERDICT: ${{ steps.parse_and_summarize.outputs.verdict }}
          EXIT_CODE: ${{ steps.parse_and_summarize.outputs.exit_code }}
          CLI_RC: ${{ steps.parse_and_summarize.outputs.cli_rc }}
          CHECKPOINT_ACCEPTED: ${{ steps.parse_and_summarize.outputs.checkpoint_accepted }}
          IS_VALID_ASSESSMENT: ${{ steps.parse_and_summarize.outputs.is_valid_assessment }}
        run: |
          set -euo pipefail

          echo "Enforcing gate policy: mode='$GATE_MODE', verdict='$VERDICT', exit_code='$EXIT_CODE', cli_rc='$CLI_RC', accepted='$CHECKPOINT_ACCEPTED', valid='$IS_VALID_ASSESSMENT'"

          if [ "$GATE_MODE" = "strict" ]; then
            if [ "$CHECKPOINT_ACCEPTED" != "true" ]; then
              echo "::error::Strict acceptance gate failed: checkpoint is NOT accepted (verdict: $VERDICT, exit_code: $EXIT_CODE, cli_rc: $CLI_RC, accepted: $CHECKPOINT_ACCEPTED)."
              exit 1
            fi
            echo "Strict acceptance gate satisfied: checkpoint accepted with verdict ASSESSED_PROVISIONAL_PASS."
          elif [ "$GATE_MODE" = "observation" ]; then
            if [ "$CLI_RC" -eq 4 ] || [ "$IS_VALID_ASSESSMENT" != "true" ]; then
              echo "::error::Observation mode failed: operational error or invalid assessment (cli_rc: $CLI_RC, valid: $IS_VALID_ASSESSMENT)."
              exit 1
            fi
            echo "Observation mode: verification completed with exit code $EXIT_CODE ($VERDICT)."
            echo "Checkpoint acceptance status: $CHECKPOINT_ACCEPTED."
          else
            echo "::error::Unrecognized gate_mode '$GATE_MODE'."
            exit 1
          fi
