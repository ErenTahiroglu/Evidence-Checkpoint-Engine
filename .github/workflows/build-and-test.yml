name: Build and Test

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
          - os: macos-26
            name: macOS ARM64
          - os: windows-2025
            name: Windows x64
          - os: macos-26-intel
            name: macOS Intel x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('ece/Cargo.lock', 'ece/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        working-directory: ece
        run: cargo fmt --all -- --check

      - name: Check compilation
        working-directory: ece
        run: cargo check --locked --all-targets

      - name: Clippy linter
        working-directory: ece
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run test suite
        working-directory: ece
        run: cargo test --locked

      - name: Build release binary
        working-directory: ece
        run: cargo build --locked --release

      - name: Smoke test CLI (Unix)
        if: runner.os != 'Windows'
        working-directory: ece
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./target/release/ece verify-envelope \
            --input ../docs/gov-00/fixtures/envelope_valid_bootstrap_checkpoint.json \
            --schema-dir ../docs/gov-00/schemas
          rc=$?
          if [ $rc -ne 1 ]; then
            echo "Expected exit code 1 for verify-envelope, got $rc"
            exit 1
          fi

          ./target/release/ece inspect-untrusted-payload \
            --input ../docs/gov-00/fixtures/input_valid_bootstrap_checkpoint.json \
            --schema-dir ../docs/gov-00/schemas
          rc=$?
          if [ $rc -ne 3 ]; then
            echo "Expected exit code 3 for inspect-untrusted-payload, got $rc"
            exit 1
          fi

          mkdir -p incompatible_schemas
          cp ../docs/gov-00/schemas/checkpoint-input.schema.json incompatible_schemas/
          cp ../docs/gov-00/schemas/checkpoint-envelope.schema.json incompatible_schemas/
          printf '%s\n' '{' \
            '  "$schema": "https://json-schema.org/draft/2020-12/schema",' \
            '  "$id": "https://github.com/ErenTahiroglu/Evidence-Checkpoint-Engine/schemas/v0.1.0/assessment-output.schema.json",' \
            '  "type": "object",' \
            '  "required": ["mandatory_field_engine_will_never_emit"],' \
            '  "properties": {' \
            '    "mandatory_field_engine_will_never_emit": {' \
            '      "type": "string"' \
            '    }' \
            '  }' \
            '}' > incompatible_schemas/assessment-output.schema.json

          ./target/release/ece verify-envelope \
            --input ../docs/gov-00/fixtures/envelope_valid_bootstrap_checkpoint.json \
            --schema-dir incompatible_schemas > out_incomp.txt 2> err_incomp.txt
          rc=$?
          if [ $rc -ne 4 ]; then
            echo "Expected exit code 4 for incompatible assessment schema, got $rc"
            exit 1
          fi
          if [ -s out_incomp.txt ]; then
            echo "Expected empty stdout on output schema violation"
            exit 1
          fi
          if ! grep -q "OUTPUT_SCHEMA_VIOLATION" err_incomp.txt; then
            echo "Expected OUTPUT_SCHEMA_VIOLATION in stderr"
            exit 1
          fi
          rm -rf incompatible_schemas out_incomp.txt err_incomp.txt

          # GOV-02 GitHub Evidence Pilot Smoke Test (historical run 40969401836)
          ./target/release/ece assess-github-run \
            --owner ErenTahiroglu \
            --repo Evidence-Checkpoint-Engine \
            --expected-repo-id 1432704795 \
            --commit-sha 415990746d5bbd3756f743b4b5a7673b36228567 \
            --run-id 40969401836 \
            --run-attempt 1 \
            --schema-dir ../docs/gov-00/schemas > pilot_out.json 2> pilot_err.txt
          pilot_rc=$?
          if [ $pilot_rc -ne 1 ]; then
            echo "Expected exit code 1 for real GitHub pilot, got $pilot_rc"
            cat pilot_err.txt
            exit 1
          fi
          if ! grep -q "VERIFIED_PASS" pilot_out.json; then
            echo "Expected VERIFIED_PASS in pilot assessment output"
            cat pilot_out.json
            exit 1
          fi
          rm -f pilot_out.json pilot_err.txt

      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: ece
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./target/release/ece.exe verify-envelope \
            --input ../docs/gov-00/fixtures/envelope_valid_bootstrap_checkpoint.json \
            --schema-dir ../docs/gov-00/schemas
          rc=$?
          if [ $rc -ne 1 ]; then
            echo "Expected exit code 1 for verify-envelope, got $rc"
            exit 1
          fi

          ./target/release/ece.exe inspect-untrusted-payload \
            --input ../docs/gov-00/fixtures/input_valid_bootstrap_checkpoint.json \
            --schema-dir ../docs/gov-00/schemas
          rc=$?
          if [ $rc -ne 3 ]; then
            echo "Expected exit code 3 for inspect-untrusted-payload, got $rc"
            exit 1
          fi

          mkdir -p incompatible_schemas
          cp ../docs/gov-00/schemas/checkpoint-input.schema.json incompatible_schemas/
          cp ../docs/gov-00/schemas/checkpoint-envelope.schema.json incompatible_schemas/
          printf '%s\n' '{' \
            '  "$schema": "https://json-schema.org/draft/2020-12/schema",' \
            '  "$id": "https://github.com/ErenTahiroglu/Evidence-Checkpoint-Engine/schemas/v0.1.0/assessment-output.schema.json",' \
            '  "type": "object",' \
            '  "required": ["mandatory_field_engine_will_never_emit"],' \
            '  "properties": {' \
            '    "mandatory_field_engine_will_never_emit": {' \
            '      "type": "string"' \
            '    }' \
            '  }' \
            '}' > incompatible_schemas/assessment-output.schema.json

          ./target/release/ece.exe verify-envelope \
            --input ../docs/gov-00/fixtures/envelope_valid_bootstrap_checkpoint.json \
            --schema-dir incompatible_schemas > out_incomp.txt 2> err_incomp.txt
          rc=$?
          if [ $rc -ne 4 ]; then
            echo "Expected exit code 4 for incompatible assessment schema, got $rc"
            exit 1
          fi
          if [ -s out_incomp.txt ]; then
            echo "Expected empty stdout on output schema violation"
            exit 1
          fi
          if ! grep -q "OUTPUT_SCHEMA_VIOLATION" err_incomp.txt; then
            echo "Expected OUTPUT_SCHEMA_VIOLATION in stderr"
            exit 1
          fi
          rm -rf incompatible_schemas out_incomp.txt err_incomp.txt

          # GOV-02 GitHub Evidence Pilot Smoke Test (historical run 40969401836)
          ./target/release/ece.exe assess-github-run \
            --owner ErenTahiroglu \
            --repo Evidence-Checkpoint-Engine \
            --expected-repo-id 1432704795 \
            --commit-sha 415990746d5bbd3756f743b4b5a7673b36228567 \
            --run-id 40969401836 \
            --run-attempt 1 \
            --schema-dir ../docs/gov-00/schemas > pilot_out.json 2> pilot_err.txt
          pilot_rc=$?
          if [ $pilot_rc -ne 1 ]; then
            echo "Expected exit code 1 for real GitHub pilot, got $pilot_rc"
            cat pilot_err.txt
            exit 1
          fi
          if ! grep -q "VERIFIED_PASS" pilot_out.json; then
            echo "Expected VERIFIED_PASS in pilot assessment output"
            cat pilot_out.json
            exit 1
          fi
          rm -f pilot_out.json pilot_err.txt
